<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Audio-Video</title>
    </head>

    <body>
        <video controls height="500" width="500">
            <source src="my-video.mp4" type="video/mp4" >
        </video><br/>

        <audio controls>
            <source src="my-audio.mp3" type="audio/mp3">
        </audio><br/>

        <iframe height="500px" width="500px" src="https://www.amazon.com/"></iframe>
    </body>
</html>
