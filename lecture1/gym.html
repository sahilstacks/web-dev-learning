<html>
    <head>
        <title>Hulk GYM</title>
    </head>

    <body>
        <h1>Hulk Gym</h1>
        <form>
            <label>Name: </label>
            <input type="text" /> 

            <label>Age: </label>
            <input type="number" />

            <label>Height: </label>
            <input type="number"/><br/> <br/>

            <label>Gender: </label>
            Male <input type="radio" name="gender">
            Female <input type="radio" name="gender">

            <label>City: </label>
            <select>
                <option>Delhi</option>
                <option>Kolkata</option>
                <option>Dehradun</option>
            </select> <br/> <br/>

            <label>Email: </label>
            <input type="email" />

            <label>Password: </label>
            <input type="password">  <br/> <br/>

            <label>Contact: </label>
            <input type="tel" />

            <label>Emergency Contact: </label>
            <input type="tel" /> <br/> <br/>

            <label>Membership Time: </label>
            1 Month <input type="checkbox"/>
            3 Months <input type="checkbox"/>
            6 Months <input type="checkbox"/> <br/> <br/>
            
            <button>Submit</button>
        </form>
    </body>
</html>
