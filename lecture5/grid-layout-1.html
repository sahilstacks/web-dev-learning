<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 25px;
        }
        .box{
            background-color:orange;
            padding: 25px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Different Grid Sizes</h1>
    <div class="container">
        <div class="box">Column1</div>
        <div class="box">Column2</div>
        <div class="box">Column3</div>
        <div class="box">Column4</div>
        <div class="box">Column5</div>
        <div class="box">Column6</div>
    </div>
</body>
</html>
